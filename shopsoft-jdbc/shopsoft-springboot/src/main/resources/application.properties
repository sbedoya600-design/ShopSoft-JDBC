# Conexión a la base de datos existente de ShopSoft.
spring.datasource.url=jdbc:mariadb://localhost:3306/supermercado
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# No modificar ni recrear automáticamente las tablas existentes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8081
