<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto ShopSoft</title>
<style>body{font-family:Arial;background:#f2f5f3;padding:30px}main{max-width:520px;margin:auto;background:white;padding:25px;border-radius:12px}h1{color:#176b45}label{display:block;margin-top:14px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;border:1px solid #bbb;border-radius:6px}button{margin-top:20px;background:#176b45;color:white;padding:11px;border:0;border-radius:6px}a{margin-left:10px}</style></head>
<body><main><h1 th:text="${titulo}">Producto</h1>
<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
<input type="hidden" th:field="*{idProducto}">
<label>Nombre</label><input type="text" th:field="*{nombre}" required maxlength="150">
<label>Precio</label><input type="number" th:field="*{precio}" min="0" step="0.01" required>
<label>Cantidad</label><input type="number" th:field="*{cantidad}" min="0" required>
<label>Fecha de vencimiento (opcional)</label><input type="date" th:field="*{fechaVencimiento}">
<input type="hidden" th:field="*{idCategoria}" value="1">
<button type="submit">Guardar</button><a th:href="@{/productos}">Cancelar</a>
</form></main></body></html>
